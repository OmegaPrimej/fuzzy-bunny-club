plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fuzzybunny.club'
    compileSdk 34

    defaultConfig {
        applicationId "com.fuzzybunny.club"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Ghost QR - BTC style rotating
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'
    
    // Live Broadcast - CameraX + WebRTC
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'org.webrtc:google-webrtc:1.106.0'
    
    // Fire Ring Circle + Sidekick + Advertising ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'io.socket:socket.io-client:2.1.0'
    
    // Fire TV Keyboard widget
    implementation 'androidx.webkit:webkit:1.9.0'
}
